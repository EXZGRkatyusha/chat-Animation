<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>码道小助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #f0f0f0;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .phone {
    width: 375px;
    height: 720px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: #ededed;
    border-radius: 12px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
  }

  .navbar {
    flex: none;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    font-weight: 600;
    color: #000;
    background: #ededed;
    border-bottom: 1px solid #d9d9d9;
  }

  .chat {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 16px;
    padding: 12px;
    overflow-y: auto;
    background: #ededed;
  }

  .msg {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    animation: pop 0.25s ease-out;
  }

  .msg.right { justify-content: flex-end; }

  @keyframes pop {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    flex: none;
    width: 36px;
    height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 6px;
    font-size: 14px;
    color: #fff;
  }

  .msg.left .avatar { background: #5b8ff9; }
  .msg.right .avatar { background: #95ec69; color: #0a4d00; }

  .bubble {
    max-width: 70%;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.4;
    color: #000;
    word-break: break-word;
  }

  .bubble.white { background: #ffffff; }
  .bubble.green { background: #95ec69; }

  .bubble.typing {
    display: flex;
    align-items: center;
    gap: 5px;
    min-height: 36px;
    padding: 0 14px;
  }

  .bubble.typing span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #b6b6b6;
    animation: typing-blink 1.2s infinite ease-in-out;
  }

  .bubble.typing span:nth-child(2) { animation-delay: 0.18s; }
  .bubble.typing span:nth-child(3) { animation-delay: 0.36s; }

  @keyframes typing-blink {
    0%, 60%, 100% { opacity: 0.35; transform: translateY(0); }
    30%           { opacity: 1;    transform: translateY(-4px); }
  }
</style>
</head>
<body>
  <div class="phone">
    <header class="navbar">码道小助手</header>
    <main class="chat" id="chat"></main>
  </div>

<script>
(function () {
  var chat = document.getElementById('chat');

  var script = [
    { from: 'them', text: '在吗？' },
    { from: 'me',   text: '在的怎么啦' },
    { from: 'them', text: '我想用 AI 做一个无限动画，听说可以用 git 边做边回退？' },
    { from: 'me',   text: '对思路很简单' },
    { from: 'me',   text: '满意就 commit，不满意就 checkout / reset 回退再改' },
    { from: 'them', text: '懂了那我先去试试' },
    { from: 'me',   text: '👍 有不懂的随时问' }
  ];

  var sleep = function (ms) {
    return new Promise(function (resolve) { setTimeout(resolve, ms); });
  };

  function scrollToBottom() {
    chat.scrollTop = chat.scrollHeight;
  }

  function makeAvatar(from) {
    var avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = from === 'them' ? '对' : '我';
    return avatar;
  }

  function makeRow(from, inner) {
    var row = document.createElement('div');
    row.className = 'msg ' + (from === 'them' ? 'left' : 'right');
    if (from === 'them') {
      row.appendChild(makeAvatar(from));
      row.appendChild(inner);
    } else {
      row.appendChild(inner);
      row.appendChild(makeAvatar(from));
    }
    return row;
  }

  function addMessage(from, text) {
    var bubble = document.createElement('div');
    bubble.className = 'bubble ' + (from === 'them' ? 'white' : 'green');
    bubble.textContent = text;
    chat.appendChild(makeRow(from, bubble));
    scrollToBottom();
  }

  function showTyping() {
    var bubble = document.createElement('div');
    bubble.className = 'bubble white typing';
    for (var i = 0; i < 3; i++) {
      bubble.appendChild(document.createElement('span'));
    }
    var row = makeRow('them', bubble);
    chat.appendChild(row);
    scrollToBottom();
    return row;
  }

  async function play() {
    chat.innerHTML = '';
    await sleep(600);

    for (var i = 0; i < script.length; i++) {
      var step = script[i];

      if (step.from === 'them') {
        var typing = showTyping();
        await sleep(1300);
        typing.remove();
      } else {
        await sleep(450);
      }

      addMessage(step.from, step.text);
      await sleep(950);
    }

    await sleep(2200);
    play();
  }

  play();
})();
</script>
</body>
</html>
